<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Live Sync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }
        .sidebar-header { background: #1e3c72; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .stat-card { border: none; border-radius: 15px; color: white; padding: 20px; position: relative; overflow: hidden; }
        .bg-users { background: linear-gradient(45deg, #4099ff, #73b4ff); }
        .bg-deposit { background: linear-gradient(45deg, #2ed8b6, #59e0c5); }
        .bg-withdraw { background: linear-gradient(45deg, #ffb64d, #ffcb80); }
        .stat-card i { position: absolute; right: 15px; bottom: 15px; font-size: 2rem; opacity: 0.3; }
        .table-container { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .screenshot-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="sidebar-header mb-4">
        <i class="fa-solid fa-user-shield me-2"></i> Admin Panel Control (Live)
    </div>

    <div class="container">
        <!-- Stat Cards -->
        <div class="row g-3 mb-4 text-center">
            <div class="col-6 col-md-4">
                <div class="stat-card bg-users">
                    <div class="small">Total Users</div>
                    <h3 id="totalUsersCount">0</h3><i class="fa-solid fa-users"></i>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="stat-card bg-deposit">
                    <div class="small">Pending Deposit</div>
                    <h3 id="pendingDepositCount">0</h3><i class="fa-solid fa-wallet"></i>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="stat-card bg-withdraw">
                    <div class="small">Pending Withdraw</div>
                    <h3 id="pendingWithdrawCount">0</h3><i class="fa-solid fa-money-bill-transfer"></i>
                </div>
            </div>
        </div>

        <!-- 1. Registered Users Table -->
        <div class="table-container table-responsive">
            <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-users-gear me-2"></i> All Registered Users</h5>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>User Identifier / Phone</th>
                        <th>Gmail ID</th>
                        <th>Balance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>

        <!-- 2. Pending Deposits -->
        <div class="table-container table-responsive">
            <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-arrow-down-to-bracket me-2"></i> Pending Deposits</h5>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>User Details</th>
                        <th>Amount</th>
                        <th>Screenshot</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="depositList"></tbody>
            </table>
        </div>

        <!-- 3. Pending Withdraws -->
        <div class="table-container table-responsive">
            <h5 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-arrow-up-from-bracket me-2"></i> Pending Withdraws</h5>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>User Details</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="withdrawList"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, updateDoc, deleteDoc, doc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBk55D5GqpaVa9zpdYM_p00syFj8tPta4g",
            authDomain: "riya-9c6d4.firebaseapp.com",
            projectId: "riya-9c6d4",
            storageBucket: "riya-9c6d4.firebasestorage.app",
            messagingSenderId: "169192342445",
            appId: "1:169192342445:web:127f76562d4eb3fbfe5724"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let usersLookup = {}; // युजरहरूको सम्पूर्ण डिटेल म्याप गर्नको लागि

        // 1. Load All Users & Map Data
        onSnapshot(collection(db, "users"), (snapshot) => {
            document.getElementById("totalUsersCount").innerText = snapshot.size;
            let usersHtml = "";
            usersLookup = {};

            snapshot.forEach((res) => {
                const data = res.data();
                const email = data.email || data.gmail || data.userEmail || 'N/A';
                const phone = data.phone || data.mobile || data.userPhone || 'N/A';
                const balance = data.balance !== undefined ? data.balance : 0;
                const docId = res.id; // Firestore Document ID (जसलाई ब्यालेन्स अपडेट गर्न प्रयोग गरिन्छ)

                // विभिन्न तरिकाले म्यापमा सेभ गर्ने ताकि डिपोजिटमा जुनसुकै डेटा (इमेल वा फोन) आए पनि भेटियोस्
                usersLookup[docId] = { email, phone, docId };
                if (email !== 'N/A') usersLookup[email.toLowerCase()] = { email, phone, docId };
                if (phone !== 'N/A') usersLookup[phone] = { email, phone, docId };
                if (data.userId) usersLookup[data.userId] = { email, phone, docId };

                usersHtml += `
                    <tr>
                        <td><b>${phone !== 'N/A' ? phone : docId}</b></td>
                        <td><span class="text-muted"><i class="fa-regular fa-envelope me-1"></i> ${email}</span></td>
                        <td class="fw-bold text-success">रु ${balance}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser('${docId}')">
                                <i class="fa-solid fa-trash me-1"></i> Delete
                            </button>
                        </td>
                    </tr>`;
            });
            document.getElementById("usersList").innerHTML = usersHtml;
        });

        // --- Delete User ---
        window.deleteUser = async (userId) => {
            const confirm = await Swal.fire({
                title: 'के तपाईं यो युजरलाई हटाउन चाहनुहुन्छ?',
                text: "यो प्रक्रिया फेरि फिर्ता ल्याउन सकिने छैन!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'हो, डिलिट गरौं',
                cancelButtonText: 'रद्द गर्नुहोस्'
            });

            if (confirm.isConfirmed) {
                try {
                    await deleteDoc(doc(db, "users", userId));
                    Swal.fire('डिलिट भयो!', 'युजर डाटा सफलतापूर्वक हटाइयो।', 'success');
                } catch (e) {
                    Swal.fire('त्रुटि!', 'युजर डिलिट गर्न सकिएन।', 'error');
                }
            }
        };

        // 2. Load Pending Deposits
        const depositQuery = query(collection(db, "deposits"), where("status", "==", "pending"));
        onSnapshot(depositQuery, async (snapshot) => {
            let html = "";
            document.getElementById("pendingDepositCount").innerText = snapshot.size;

            for (const res of snapshot.docs) {
                const data = res.data();
                
                // डिपोजिटमा सेभ भएको सम्भावित पहिचान (इमेल, फोन, वा युजर आईडी)
                let depositUserKey = data.email || data.userEmail || data.gmail || data.userPhone || data.phone || data.userId || '';
                
                let displayEmail = 'N/A';
                let displayPhone = 'N/A';
                let targetDocId = '';

                // १. हाम्रो म्यापबाट खोज्ने
                let matchedUser = usersLookup[depositUserKey] || usersLookup[String(depositUserKey).toLowerCase()];

                if (matchedUser) {
                    displayEmail = matchedUser.email;
                    displayPhone = matchedUser.phone;
                    targetDocId = matchedUser.docId;
                } else {
                    // २. यदि म्यापमा भेटिएन भने सीधा डकुमेन्ट आईडी मान्ने
                    targetDocId = depositUserKey;
                    displayPhone = depositUserKey;
                }

                html += `
                    <tr>
                        <td>
                            <b>${displayPhone}</b><br>
                            <small class="text-muted"><i class="fa-regular fa-envelope me-1"></i> ${displayEmail}</small>
                        </td>
                        <td class="fw-bold text-success">रु ${data.amount}</td>
                        <td><img src="${data.screenshotURL}" class="screenshot-img" onclick="viewImg('${data.screenshotURL}')"></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="approveDeposit('${res.id}', '${targetDocId}', ${data.amount})">Approve</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectRequest('deposits', '${res.id}')">Reject</button>
                        </td>
                    </tr>`;
            }
            document.getElementById("depositList").innerHTML = html;
        });

        // --- Approve Deposit ---
        window.approveDeposit = async (depositId, userDocId, amount) => {
            if (!userDocId || userDocId === 'undefined' || userDocId === 'null' || userDocId === '') {
                Swal.fire('त्रुटि!', 'यो डिपोजिटसँग सम्बन्धित युजर आईडी फेला परेन।', 'error');
                return;
            }

            const confirm = await Swal.fire({
                title: 'के तपाईं पक्का हुनुहुन्छ?',
                text: `रु ${amount} एप्रुभ गरेपछि प्रयोगकर्ताको खातामा थपिनेछ।`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'हो, एप्रुभ गरौं'
            });

            if (confirm.isConfirmed) {
                try {
                    // १. डिपोजिट स्टाटस 'approved' गर्ने
                    await updateDoc(doc(db, "deposits", depositId), { status: "approved" });

                    // २. सहि युजरको डकुमेन्ट आईडीमा ब्यालेन्स जोड्ने
                    const userRef = doc(db, "users", userDocId);
                    await updateDoc(userRef, {
                        balance: increment(Number(amount))
                    });

                    Swal.fire('सफल भयो!', 'डिपोजिट एप्रुभ भयो र ब्यालेन्स थपियो।', 'success');
                } catch (e) {
                    Swal.fire('Error!', 'डेटा अपडेट गर्न सकिएन: ' + e.message, 'error');
                }
            }
        };

        // Reject Request
        window.rejectRequest = async (col, id) => {
            const confirm = await Swal.fire({
                title: 'के तपाईं पक्का हुनुहुन्छ?',
                text: "यो अनुरोध अस्वीकृत गरिनेछ।",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'हो, अस्वीकृत गर्नुहोस्'
            });

            if (confirm.isConfirmed) {
                await updateDoc(doc(db, col, id), { status: "rejected" });
                Swal.fire('Rejected', 'अनुरोध अस्वीकृत गरियो।', 'info');
            }
        };

        // 3. Load Pending Withdraws
        const withdrawQuery = query(collection(db, "withdraws"), where("status", "==", "pending"));
        onSnapshot(withdrawQuery, (snapshot) => {
            let html = "";
            document.getElementById("pendingWithdrawCount").innerText = snapshot.size;
            snapshot.forEach((res) => {
                const data = res.data();
                const withdrawUser = data.email || data.userEmail || data.userPhone || data.phone || 'N/A';
                html += `
                    <tr>
                        <td><b>${withdrawUser}</b></td>
                        <td class="fw-bold text-danger">रु ${data.amount}</td>
                        <td><small>${data.method}: ${data.walletNo}</small></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateDoc(doc(db, 'withdraws', '${res.id}'), {status:'approved'})">Complete</button>
                        </td>
                    </tr>`;
            });
            document.getElementById("withdrawList").innerHTML = html;
        });

        window.viewImg = (url) => { Swal.fire({ imageUrl: url, imageAlt: 'Proof' }); };
    </script>
</body>
</html>
