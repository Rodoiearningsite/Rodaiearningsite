<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Firebase Linked</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .auth-container { width: 100%; max-width: 400px; padding: 20px; }
        .auth-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .nav-pills { background: #f1f3f5; border-radius: 15px; padding: 5px; margin-bottom: 25px; }
        .nav-link { border-radius: 12px !important; color: #555; font-weight: 600; }
        .nav-pills .nav-link.active { background: linear-gradient(135deg, #1e3c72, #2a5298) !important; }
        .input-group { margin-bottom: 18px; }
        .input-group-text { background: #f8f9fa; border-right: none; color: #1e3c72; border-radius: 12px 0 0 12px; }
        .form-control { border-left: none; border-radius: 0 12px 12px 0; padding: 12px; background: #f8f9fa; }
        .btn-auth { background: linear-gradient(to right, #1e3c72, #2a5298); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <ul class="nav nav-pills nav-fill" id="pills-tab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">Login</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">Register</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Login Tab -->
            <div class="tab-pane fade show active" id="pills-login">
                <form id="loginForm">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Gmail Address" required>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPass" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn-auth">Login</button>
                </form>
            </div>

            <!-- Register Tab -->
            <div class="tab-pane fade" id="pills-register">
                <form id="registerForm">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="regName" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="regEmail" class="form-control" placeholder="Gmail Address" required>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="regPass" class="form-control" placeholder="Create Password" required>
                    </div>
                    <button type="submit" id="regBtn" class="btn-auth">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBk55D5GqpaVa9zpdYM_p00syFj8tPta4g",
        authDomain: "riya-9c6d4.firebaseapp.com",
        projectId: "riya-9c6d4",
        storageBucket: "riya-9c6d4.firebasestorage.app",
        messagingSenderId: "169192342445",
        appId: "1:169192342445:web:127f76562d4eb3fbfe5724"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Helper function to sanitize email for Firestore document IDs (replaces special characters)
    function sanitizeEmail(email) {
        return email.trim().toLowerCase();
    }

    // Register Handling
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = sanitizeEmail(document.getElementById('regEmail').value);
        const pass = document.getElementById('regPass').value;
        const regBtn = document.getElementById('regBtn');

        regBtn.disabled = true;
        regBtn.innerText = "Processing...";

        try {
            // Check if user already exists using email as document ID
            const userRef = doc(db, "users", email);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                Swal.fire('Error', 'This Gmail address is already registered.', 'error');
                regBtn.disabled = false;
                regBtn.innerText = "Create Account";
            } else {
                await setDoc(userRef, {
                    name: name,
                    email: email,
                    password: pass,
                    balance: 0,
                    joinedAt: new Date().toISOString()
                });
                
                localStorage.setItem("userEmail", email);
                Swal.fire('Success', 'Account created successfully!', 'success').then(() => {
                    window.location.href = "home.html";
                });
            }
        } catch (err) {
            console.error(err);
            Swal.fire('Error', 'Something went wrong. Please try again.', 'error');
            regBtn.disabled = false;
            regBtn.innerText = "Create Account";
        }
    });

    // Login Handling
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = sanitizeEmail(document.getElementById('loginEmail').value);
        const pass = document.getElementById('loginPass').value;
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.disabled = true;
        loginBtn.innerText = "Verifying...";

        try {
            const userRef = doc(db, "users", email);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists() && userSnap.data().password === pass) {
                localStorage.setItem("userEmail", email);
                Swal.fire({ icon: 'success', title: 'Login Successful!', showConfirmButton: false, timer: 1500 })
                .then(() => { window.location.href = "home.html"; });
            } else {
                Swal.fire('Error', 'Invalid Gmail address or password.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            }
        } catch (err) {
            console.error(err);
            Swal.fire('Error', 'Failed to login. Please try again.', 'error');
            loginBtn.disabled = false;
            loginBtn.innerText = "Login";
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
